<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090d">
  <title>JEEP ROYAL VVIP CPM</title>
  <style>
    :root{--bg:#09090d;--panel:#14141c;--line:#30303c;--gold:#d7b45a;--muted:#a5a5b2;--white:#f7f7fb}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#292033 0,#09090d 48%);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
    .wrap{width:min(100% - 28px,760px);margin:0 auto;padding:28px 0 60px}
    header{text-align:center;padding:22px 8px 28px}
    .crown{font-size:35px}.brand{font-weight:900;letter-spacing:1.5px;font-size:clamp(22px,6vw,34px);background:linear-gradient(90deg,#f7d77c,#fff,#a78bfa,#55e6d0,#f7d77c);background-size:250%;color:transparent;background-clip:text;-webkit-background-clip:text}
    .sub{color:var(--muted);font-size:12px;letter-spacing:2px;margin-top:8px}
    .card{background:rgba(20,20,28,.94);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 18px 55px #0008}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
    button{font:inherit;cursor:pointer;border:0}
    .tab{padding:12px;border-radius:12px;background:#252530;color:#c7c7d1;font-weight:800}
    .tab.active{background:linear-gradient(100deg,#c59b3d,#f4d98b);color:#17120a}
    h1{font-size:22px;margin:0 0 6px}.desc{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 20px}
    label{display:block;font-size:13px;font-weight:750;margin:15px 0 7px}
    input{width:100%;padding:14px;border:1px solid #3b3b49;border-radius:12px;background:#0d0d13;color:white;font-size:16px;outline:none}
    input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #d7b45a20}
    .hint{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5}
    .primary{width:100%;margin-top:20px;padding:15px;border-radius:13px;background:linear-gradient(100deg,#c49a3e,#f3d98e);color:#17120a;font-weight:900}
    .primary:disabled{opacity:.5;cursor:not-allowed}
    .status{display:none;margin-top:14px;padding:12px;border-radius:11px;font-size:13px;line-height:1.5;background:#242431;color:#eee}
    .status.error{display:block;background:#401f27;color:#ffd6dc}.status.ok{display:block;background:#18352b;color:#c9ffe4}
    .verify{display:flex;align-items:center;gap:10px;margin-top:17px;padding:12px;border:1px solid #3b3b49;border-radius:12px;font-size:13px;color:#ddd}
    .verify input{width:18px;height:18px;accent-color:#d7b45a}
    .verify .tick{margin-left:auto;color:#8ce0ad;font-weight:800}
    .hidden{display:none!important}
    .note{margin:18px 2px 0;color:#92929e;font-size:11px;line-height:1.6;text-align:center}
    .footer{text-align:center;color:#777783;font-size:11px;margin-top:22px}
    @media(min-width:600px){.card{padding:30px}.wrap{padding-top:42px}}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="crown">👑</div>
    <div class="brand">JEEP ROYAL VVIP CPM</div>
    <div class="sub">CAR PARKING MULTIPLAYER 1 &amp; 2</div>
  </header>
  <main class="card">
    <div class="tabs">
      <button class="tab active" id="loginTab" type="button">로그인</button>
      <button class="tab" id="signupTab" type="button">회원가입</button>
    </div>
    <section id="loginPanel">
      <h1>다시 오신 걸 환영합니다</h1>
      <p class="desc">가입한 아이디와 비밀번호로 로그인하세요.</p>
      <form id="loginForm">
        <label for="loginUsername">아이디</label>
        <input id="loginUsername" autocomplete="username" maxlength="24" placeholder="아이디 입력" required>
        <label for="loginPassword">비밀번호</label>
        <input id="loginPassword" type="password" autocomplete="current-password" placeholder="비밀번호 입력" required>
        <button class="primary" type="submit">로그인</button>
      </form>
    </section>
    <section id="signupPanel" class="hidden">
      <h1>새 계정 만들기</h1>
      <p class="desc">이메일 입력 없이 아이디와 비밀번호로 가입합니다.</p>
      <form id="signupForm">
        <label for="signupUsername">아이디</label>
        <input id="signupUsername" autocomplete="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9-]+" placeholder="영문·숫자·하이픈 3~24자" required>
        <div class="hint">영문, 숫자, 하이픈(-)만 사용할 수 있어요. 하이픈으로 시작하거나 끝낼 수 없습니다.</div>
        <label for="signupPassword">비밀번호</label>
        <input id="signupPassword" type="password" autocomplete="new-password" minlength="8" placeholder="8자 이상 입력" required>
        <label for="signupPassword2">비밀번호 재입력</label>
        <input id="signupPassword2" type="password" autocomplete="new-password" minlength="8" placeholder="비밀번호 다시 입력" required>
        <div class="verify">
          <input id="verifyCheck" type="checkbox" required>
          <span>본인 확인을 완료했습니다.</span>
          <span class="tick">✓ 인증 확인</span>
        </div>
        <button class="primary" type="submit">회원가입 완료</button>
      </form>
    </section>
    <div id="message" class="status" role="status" aria-live="polite"></div>
  </main>
  <p class="note">비밀번호는 안전하게 인증 서비스에 전달됩니다. 게임 계정 비밀번호는 절대 입력하지 마세요.</p>
  <div class="footer">© JEEP ROYAL VVIP CPM</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Supabase 프로젝트의 공개 publishable key만 사용하세요.
  // service_role 키나 데이터베이스 비밀번호를 브라우저 코드에 넣지 마세요.
  const SUPABASE_URL = "https://gxeriuynnaasebovpyxl.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_7Zx9h3IhdReAtwn9QGFn8g_A_dS8SbD";
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  // Supabase Auth는 이메일 형식을 요구하므로, 화면에는 이메일을 노출하지 않고
  // 아이디를 내부용 별칭 주소로 변환합니다. Auth 설정에서 이메일 확인을 꺼야
  // 이메일 없이 즉시 가입이 완료됩니다. 이 별칭 주소로 메일은 받을 수 없습니다.
  const toAliasEmail = username => username.trim().toLowerCase() + "@accounts.jeep-royal.invalid";

  const $ = id => document.getElementById(id);
  function showMessage(text, type="ok") {
    const box = $("message"); box.textContent = text;
    box.className = "status " + type;
  }
  function switchTab(which) {
    const signup = which === "signup";
    $("loginPanel").classList.toggle("hidden", signup);
    $("signupPanel").classList.toggle("hidden", !signup);
    $("loginTab").classList.toggle("active", !signup);
    $("signupTab").classList.toggle("active", signup);
    $("message").className = "status";
  }
  $("loginTab").addEventListener("click", () => switchTab("login"));
  $("signupTab").addEventListener("click", () => switchTab("signup"));

  $("signupForm").addEventListener("submit", async e => {
    e.preventDefault();
    const username = $("signupUsername").value.trim();
    const password = $("signupPassword").value;
    const confirm = $("signupPassword2").value;
    if (!/^[A-Za-z0-9](?:[A-Za-z0-9-]{1,22}[A-Za-z0-9])$/.test(username)) {
      return showMessage("아이디는 영문·숫자·하이픈 3~24자이며 하이픈으로 시작하거나 끝날 수 없습니다.", "error");
    }
    if (password.length < 8) return showMessage("비밀번호는 8자 이상 입력해 주세요.", "error");
    if (password !== confirm) return showMessage("비밀번호가 서로 일치하지 않습니다.", "error");
    if (!$("verifyCheck").checked) return showMessage("본인 확인 체크를 완료해 주세요.", "error");
    const button = $("signupForm").querySelector("button"); button.disabled = true;
    try {
      const { data, error } = await db.auth.signUp({
        email: toAliasEmail(username),
        password,
        options: { data: { username } }
      });
      if (error) throw error;
      if (data.session) {
        showMessage("회원가입 및 인증이 완료됐어요. 로그인 상태입니다.", "ok");
      } else {
        showMessage("가입 요청은 접수됐지만 Supabase에서 이메일 확인이 켜져 있어요. Auth 설정에서 Confirm email을 꺼야 이메일 없이 바로 가입됩니다.", "error");
      }
    } catch (err) {
      showMessage(err.message || "회원가입에 실패했습니다. 아이디가 이미 사용 중인지 확인해 주세요.", "error");
    } finally { button.disabled = false; }
  });

  $("loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    const username = $("loginUsername").value.trim();
    const password = $("loginPassword").value;
    const button = $("loginForm").querySelector("button"); button.disabled = true;
    try {
      const { error } = await db.auth.signInWithPassword({
        email: toAliasEmail(username),
        password
      });
      if (error) throw error;
      showMessage("로그인 완료됐어요!", "ok");
    } catch (err) {
      showMessage("로그인에 실패했습니다. 아이디와 비밀번호를 확인해 주세요.", "error");
    } finally { button.disabled = false; }
  });
</script>
</body>
</html>
